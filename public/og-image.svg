<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a2016"/>
      <stop offset="50%" style="stop-color:#0f3028"/>
      <stop offset="100%" style="stop-color:#0d2840"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#21A038"/>
      <stop offset="100%" style="stop-color:#7CEB8A"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative circle -->
  <circle cx="1050" cy="120" r="300" fill="#21A038" opacity="0.08"/>
  <circle cx="150" cy="520" r="200" fill="#21A038" opacity="0.05"/>
  <!-- Logo circle -->
  <circle cx="80" cy="80" r="44" fill="url(#accent)"/>
  <text x="80" y="92" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">М</text>
  <!-- Brand name -->
  <text x="138" y="73" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">МСК АСФАЛЬТ</text>
  <text x="138" y="98" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.5)">благоустройство под ключ</text>
  <!-- Main headline -->
  <text x="80" y="240" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="white">Асфальтирование</text>
  <text x="80" y="310" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="url(#accent)">под ключ</text>
  <text x="80" y="380" font-family="Arial, sans-serif" font-size="30" fill="rgba(255,255,255,0.65)">Москва и Московская область</text>
  <!-- Stats -->
  <rect x="80" y="440" width="220" height="100" rx="16" fill="rgba(255,255,255,0.07)"/>
  <text x="190" y="490" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#7CEB8A" text-anchor="middle">от 540 ₽</text>
  <text x="190" y="520" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.5)" text-anchor="middle">за м²</text>
  <rect x="320" y="440" width="220" height="100" rx="16" fill="rgba(255,255,255,0.07)"/>
  <text x="430" y="490" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#7CEB8A" text-anchor="middle">до 5 лет</text>
  <text x="430" y="520" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.5)" text-anchor="middle">гарантия</text>
  <rect x="560" y="440" width="220" height="100" rx="16" fill="rgba(255,255,255,0.07)"/>
  <text x="670" y="490" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#7CEB8A" text-anchor="middle">850+</text>
  <text x="670" y="520" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.5)" text-anchor="middle">объектов</text>
  <!-- Phone -->
  <text x="1120" y="580" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="rgba(255,255,255,0.8)" text-anchor="end">+7 913 826-30-70</text>
  <text x="1120" y="610" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.4)" text-anchor="end">mskasfalt.ru</text>
</svg>
